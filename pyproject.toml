[project]
name = "voice-cloner"
version = "0.1.0"
description = "Clone vozes usando Qwen3-TTS e exporte para MP3."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # qwen-tts removed: it hard-pins transformers==4.57.3, which breaks
    # OmniVoice (VoiceStudio requires transformers>=5.10.0). The container
    # runs TTS_ENGINE=omnivoice, so the qwen path is unused there. Install
    # qwen-tts manually in a separate env if you need clone_qwen3_tts.py.
    "modelscope",
    "huggingface_hub",
    "scipy",
    "soundfile",
    "numpy",
    # VoiceStudio/OmniVoice requires transformers>=5.10.0; 4.x breaks the
    # qwen2 tokenizer on the model's `extra_special_tokens` (list) config.
    "transformers>=5.10.0",
    "accelerate",
    "torchaudio",
    "hf_xet",
    "pydub",
    "fastapi",
    "uvicorn[standard]",
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest",
    # FastAPI TestClient (tests/test_api.py). Was a transitive dep of qwen-tts.
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
